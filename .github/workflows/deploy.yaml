name: Deploy ScreenWeave

# Every push to main is tested and deployed (an unchanged stack is a no-op),
# and every pull request is tested, audited and scanned but never deployed.
# The old paths filter skipped the Visual QA Lambdas entirely.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# id-token: write  → request OIDC JWT exchanged for short-lived STS credentials
# contents: read   → checkout
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  STACK_NAME: screenweave
  REGION: us-east-1

jobs:
  # The MCP server's node:test suite and the Python tests (crawler guard,
  # Visual QA modules). Tests are a gate: deploy needs this job.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/lambda/mcpServer/package-lock.json
      - name: MCP server tests
        working-directory: src/lambda/mcpServer
        run: |
          npm ci
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: |
          python -m pip install pytest boto3 -r src/lambda/visualQAWorker/requirements.txt
          python -m pytest -q tests

  # Known-vulnerable dependencies block the deploy, like a red test. The
  # Visual QA worker decodes screenshots of whatever site was crawled with
  # Pillow, so its advisories are not theoretical.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (MCP server, production dependencies)
        working-directory: src/lambda/mcpServer
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit (Visual QA Lambdas)
        run: |
          python -m pip install pip-audit
          pip-audit -r src/lambda/visualQAWorker/requirements.txt --progress-spinner off
          pip-audit -r src/lambda/visualQATrigger/requirements.txt --progress-spinner off

  # Committed credentials block the deploy. gitleaks scans the full history,
  # because a secret removed in a later commit is still published. The binary
  # is a pinned release checked against its sha256.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks (full history)
        run: |
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  deploy:
    needs: [test, audit, secrets]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No long-lived AWS keys. ASSUME_ROLE_ARN is set in:
      # Settings → Secrets and variables → Variables
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ASSUME_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
          mask-aws-account-id: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/lambda/mcpServer/package-lock.json

      # sam build: runs npm install --production in src/lambda/mcpServer/,
      # copies built artifacts to .aws-sam/build/, resolves CodeUri paths.
      - name: SAM build
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build
        run: sam build --template-file infra/main-stack.yaml

      # CipherWeave tokens on /mcp are verified against this JWKS, taken here
      # on the runner (public keys only). A missing CipherWeave stack is not
      # fatal in audit mode -- /mcp then serves anonymous callers as before and
      # refuses any token it is shown -- and is fatal in enforce mode, where it
      # would refuse everyone. The mode is a repository variable (AUTH_MODE).
      - name: Resolve the CipherWeave token issuer (JWKS for /mcp)
        id: cipherweave
        env:
          AUTH_MODE: ${{ vars.AUTH_MODE || 'audit' }}
          CIPHERWEAVE_STACK_NAME: ${{ vars.CIPHERWEAVE_STACK_NAME || 'cipherweave-prod' }}
        run: |
          get() {
            aws cloudformation describe-stacks \
              --stack-name "$CIPHERWEAVE_STACK_NAME" \
              --region "$REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text 2>/dev/null || echo ""
          }
          JWKS_URL=$(get IssuerJwksUrl)
          ISSUER_ID=$(get IssuerId)
          # The CLI prints the string None for an absent output.
          if [ "$JWKS_URL" = "None" ]; then JWKS_URL=""; fi
          if [ "$ISSUER_ID" = "None" ] || [ -z "$ISSUER_ID" ]; then ISSUER_ID="urn:cipherweave:prod"; fi
          if [ "$AUTH_MODE" != audit ] && [ "$AUTH_MODE" != enforce ]; then
            echo "::error::AUTH_MODE is '$AUTH_MODE'; use audit or enforce."
            exit 1
          fi
          JWKS_B64=""
          if [ -n "$JWKS_URL" ]; then
            if JWKS_BODY=$(curl -sS --fail --max-time 15 "$JWKS_URL"); then
              JWKS_MIN=$(printf '%s' "$JWKS_BODY" | jq -c '{keys: [.keys[]? | select(.kty == "EC" and .crv == "P-256" and (has("d") | not)) | {kid, kty, crv, x, y, use, alg}]}')
              if [ "$(printf '%s' "$JWKS_MIN" | jq '.keys | length')" -gt 0 ]; then
                JWKS_B64=$(printf '%s' "$JWKS_MIN" | base64 -w0)
                echo "Deploy-time JWKS: $(printf '%s' "$JWKS_MIN" | jq -r '[.keys[].kid] | join(", ")')"
              else
                echo "::warning::$JWKS_URL has no ES256 key; /mcp will fetch the JWKS at runtime."
              fi
            else
              echo "::warning::Could not download $JWKS_URL; /mcp will fetch the JWKS at runtime."
            fi
          elif [ "$AUTH_MODE" = enforce ]; then
            echo "::error::AUTH_MODE is enforce and $CIPHERWEAVE_STACK_NAME has no IssuerJwksUrl: /mcp would refuse every caller."
            exit 1
          else
            echo "::warning::No IssuerJwksUrl on $CIPHERWEAVE_STACK_NAME. /mcp serves anonymous callers and refuses any token."
          fi
          if [ "$AUTH_MODE" = audit ]; then
            echo "::warning title=/mcp in audit mode::Requests without a token still run. Set the AUTH_MODE variable to enforce once TeamWeave sends tokens."
          fi
          {
            echo "jwks_b64=$JWKS_B64"
            echo "jwks_url=$JWKS_URL"
            echo "issuer_id=$ISSUER_ID"
            echo "auth_mode=$AUTH_MODE"
          } >> "$GITHUB_OUTPUT"

      # sam deploy --resolve-s3: SAM creates and manages its own deployment
      # bucket automatically — no bucket parameters needed.
      # All S3 buckets (ArtifactsBucket, CrawlerCodeBucket) are created by CFN.
      - name: Deploy
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "AuthMode=${{ steps.cipherweave.outputs.auth_mode }}" \
              "CipherWeaveJwks=${{ steps.cipherweave.outputs.jwks_b64 }}" \
              "CipherWeaveJwksUrl=${{ steps.cipherweave.outputs.jwks_url }}" \
              "CipherWeaveIssuer=${{ steps.cipherweave.outputs.issuer_id }}"

      # crawl.py is not packaged by SAM (it runs on EC2, not Lambda).
      # Upload it to the CrawlerCodeBucket created by CloudFormation.
      - name: Upload crawl.py to CrawlerCodeBucket
        run: |
          CRAWLER_BUCKET=$(aws cloudformation describe-stacks \
            --region "$REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CrawlerCodeBucketName'].OutputValue" \
            --output text)

          aws s3 cp src/crawler/crawl.py \
            "s3://${CRAWLER_BUCKET}/crawler/crawl.py" \
            --region "$REGION" --sse AES256

          echo "crawl.py → s3://${CRAWLER_BUCKET}/crawler/crawl.py"

      - name: Smoke-test and print MCP endpoint
        run: |
          MCP_ENDPOINT=$(aws cloudformation describe-stacks \
            --region "$REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='McpEndpoint'].OutputValue" \
            --output text)

          HTTP_STATUS=$(curl -s -o /tmp/mcp_resp.json -w "%{http_code}" \
            -X POST \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            "$MCP_ENDPOINT")

          cat /tmp/mcp_resp.json
          [[ "$HTTP_STATUS" == "200" ]] || { echo "Smoke-test failed: HTTP $HTTP_STATUS"; exit 1; }

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## ScreenWeave deployed

          | | |
          |---|---|
          | **MCP Endpoint** | \`$MCP_ENDPOINT\` |
          | **Commit** | \`${{ github.sha }}\` |
          | **Actor** | @${{ github.actor }} |

          \`\`\`json
          {"mcpServers":{"screenweave":{"url":"$MCP_ENDPOINT"}}}
          \`\`\`
          SUMMARY
