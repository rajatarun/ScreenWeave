[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "screenweave"
version = "0.2.0"
description = "ScreenWeave visual QA crawler and lightweight local browser MCP adapter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
playwright = ["playwright>=1.42"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools]
package-dir = {"screenweave" = "src/crawler"}
packages = ["screenweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "playwright: live Playwright browser tests (require playwright and chromium)",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
